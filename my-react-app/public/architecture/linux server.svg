<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 800" width="1500" height="800" font-family="DejaVu Sans, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a2a44"/></marker></defs>
<rect width="1500" height="800" fill="#ffffff"/>
<text x="30" y="34" font-size="26" font-weight="bold" fill="#12305c">Linux Server Health Monitor - Architecture</text>
<rect x="30" y="70" width="200" height="80" rx="10" fill="#eef5ff" stroke="#2b5fa8" stroke-width="2"/>
<text x="130.0" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">health-alert.timer</text>
<text x="130.0" y="118" text-anchor="middle" font-size="13.5" fill="#33415c">every 5 minutes</text>
<rect x="290" y="70" width="220" height="80" rx="10" fill="#eef5ff" stroke="#2b5fa8" stroke-width="2"/>
<text x="400.0" y="96" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">health-alert.service</text>
<text x="400.0" y="118" text-anchor="middle" font-size="13.5" fill="#33415c">runs alert.sh</text>
<rect x="570" y="60" width="240" height="110" rx="10" fill="#eaf7ea" stroke="#2e8b3d" stroke-width="2"/>
<text x="690.0" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">alert.sh</text>
<text x="690.0" y="108" text-anchor="middle" font-size="13.5" fill="#33415c">runs the check, compares</text>
<text x="690.0" y="127" text-anchor="middle" font-size="13.5" fill="#33415c">status with last_status,</text>
<text x="690.0" y="146" text-anchor="middle" font-size="13.5" fill="#33415c">sends Telegram on change</text>
<line x1="230" y1="110" x2="290" y2="110" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="110" x2="570" y2="110" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<rect x="900" y="60" width="240" height="60" rx="10" fill="#e6f4fb" stroke="#1b8bc0" stroke-width="2"/>
<text x="1020.0" y="86" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">Telegram</text>
<text x="1020.0" y="108" text-anchor="middle" font-size="13.5" fill="#33415c">alert / RECOVERED message</text>
<rect x="900" y="135" width="240" height="55" rx="10" fill="#f3eefc" stroke="#6a4bb5" stroke-width="2"/>
<text x="1020.0" y="161" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">logs/last_status</text>
<text x="1020.0" y="183" text-anchor="middle" font-size="13.5" fill="#33415c">last status (read and written)</text>
<line x1="810" y1="90" x2="900" y2="90" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<text x="855.0" y="84.0" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1a2a44">on change</text>
<line x1="810" y1="162" x2="900" y2="162" stroke="#1a2a44" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)" marker-start="url(#a)"/>
<rect x="330" y="240" width="770" height="80" rx="10" fill="#f3eefc" stroke="#6a4bb5" stroke-width="2"/>
<text x="715.0" y="266" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">health-check.sh</text>
<text x="715.0" y="288" text-anchor="middle" font-size="13.5" fill="#33415c">samples CPU, RAM, disk, uptime, services; prints report; exit code 0 / 1 / 2</text>
<line x1="690" y1="170" x2="690" y2="240" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<text x="702" y="210" text-anchor="start" font-size="12.5" font-style="italic" fill="#1a2a44">runs</text>
<line x1="690" y1="390" x2="690" y2="320" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<text x="702" y="360" text-anchor="start" font-size="12.5" font-style="italic" fill="#1a2a44">runs</text>
<rect x="30" y="215" width="260" height="130" rx="10" fill="#fff8e6" stroke="#c28a00" stroke-width="2"/>
<text x="160.0" y="241" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">System data</text>
<text x="160.0" y="263" text-anchor="middle" font-size="13.5" fill="#33415c">/proc/stat  (CPU, 2 samples)</text>
<text x="160.0" y="282" text-anchor="middle" font-size="13.5" fill="#33415c">free  (RAM)</text>
<text x="160.0" y="301" text-anchor="middle" font-size="13.5" fill="#33415c">df  (disk, / only)</text>
<text x="160.0" y="320" text-anchor="middle" font-size="13.5" fill="#33415c">systemctl is-active  (services)</text>
<line x1="290" y1="280" x2="330" y2="280" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<text x="310" y="268" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1a2a44">reads</text>
<rect x="1180" y="240" width="260" height="80" rx="10" fill="#f3eefc" stroke="#6a4bb5" stroke-width="2"/>
<text x="1310.0" y="266" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">logs/health.log</text>
<text x="1310.0" y="288" text-anchor="middle" font-size="13.5" fill="#33415c">every report</text>
<line x1="1100" y1="280" x2="1180" y2="280" stroke="#1a2a44" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#a)"/>
<text x="1140.0" y="268" text-anchor="middle" font-size="12.5" font-style="italic" fill="#1a2a44">writes</text>
<rect x="30" y="405" width="200" height="80" rx="10" fill="#eef5ff" stroke="#2b5fa8" stroke-width="2"/>
<text x="130.0" y="431" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">health-page.timer</text>
<text x="130.0" y="453" text-anchor="middle" font-size="13.5" fill="#33415c">every 1 minute</text>
<rect x="290" y="405" width="220" height="80" rx="10" fill="#eef5ff" stroke="#2b5fa8" stroke-width="2"/>
<text x="400.0" y="431" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">health-page.service</text>
<text x="400.0" y="453" text-anchor="middle" font-size="13.5" fill="#33415c">runs make-page.sh</text>
<rect x="570" y="390" width="240" height="110" rx="10" fill="#fff1e0" stroke="#d9822b" stroke-width="2"/>
<text x="690.0" y="416" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">make-page.sh</text>
<text x="690.0" y="438" text-anchor="middle" font-size="13.5" fill="#33415c">runs the check,</text>
<text x="690.0" y="457" text-anchor="middle" font-size="13.5" fill="#33415c">writes the HTML page</text>
<line x1="230" y1="445" x2="290" y2="445" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<line x1="510" y1="445" x2="570" y2="445" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<rect x="860" y="405" width="210" height="80" rx="10" fill="#f3eefc" stroke="#6a4bb5" stroke-width="2"/>
<text x="965.0" y="431" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">/var/www/health/</text>
<text x="965.0" y="453" text-anchor="middle" font-size="13.5" fill="#33415c">index.html</text>
<rect x="1110" y="405" width="150" height="80" rx="10" fill="#e6f4fb" stroke="#1b8bc0" stroke-width="2"/>
<text x="1185.0" y="431" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">Nginx</text>
<text x="1185.0" y="453" text-anchor="middle" font-size="13.5" fill="#33415c">port 8080</text>
<rect x="1300" y="395" width="140" height="100" rx="10" fill="#e8f7f0" stroke="#2e8b3d" stroke-width="2"/>
<text x="1370.0" y="421" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2a44">Browser</text>
<text x="1370.0" y="443" text-anchor="middle" font-size="13.5" fill="#33415c">page refreshes</text>
<text x="1370.0" y="462" text-anchor="middle" font-size="13.5" fill="#33415c">every 30 s</text>
<line x1="810" y1="445" x2="860" y2="445" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<line x1="1070" y1="445" x2="1110" y2="445" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<line x1="1260" y1="445" x2="1300" y2="445" stroke="#1a2a44" stroke-width="2" marker-end="url(#a)"/>
<text x="30" y="545" font-size="16" font-weight="bold" fill="#12305c">Status levels</text>
<rect x="30" y="555" width="450" height="30" fill="#dce7f7" stroke="#2b5fa8"/>
<text x="38" y="575" font-size="13" font-weight="bold" fill="#1a2a44">Status</text>
<text x="138" y="575" font-size="13" font-weight="bold" fill="#1a2a44">Exit</text>
<text x="188" y="575" font-size="13" font-weight="bold" fill="#1a2a44">Meaning</text>
<rect x="30" y="585" width="450" height="30" fill="#fff" stroke="#9db3d6"/>
<text x="38" y="605" font-size="13" fill="#1a2a44">HEALTHY</text>
<text x="138" y="605" font-size="13" fill="#1a2a44">0</text>
<text x="188" y="605" font-size="13" fill="#1a2a44">All below limits, services running</text>
<rect x="30" y="615" width="450" height="30" fill="#fff" stroke="#9db3d6"/>
<text x="38" y="635" font-size="13" fill="#1a2a44">WARNING</text>
<text x="138" y="635" font-size="13" fill="#1a2a44">1</text>
<text x="188" y="635" font-size="13" fill="#1a2a44">CPU, RAM or disk above its limit</text>
<rect x="30" y="645" width="450" height="30" fill="#fff" stroke="#9db3d6"/>
<text x="38" y="665" font-size="13" fill="#1a2a44">CRITICAL</text>
<text x="138" y="665" font-size="13" fill="#1a2a44">2</text>
<text x="188" y="665" font-size="13" fill="#1a2a44">A required service is not running</text>
<text x="30" y="700" font-size="13" fill="#33415c">Default limits: CPU 80%, RAM 80%, disk 80%.  Default services: ssh, nginx.</text>
<text x="520" y="545" font-size="16" font-weight="bold" fill="#12305c">When alert.sh sends a message</text>
<rect x="520" y="555" width="505" height="30" fill="#dce7f7" stroke="#2b5fa8"/>
<text x="528" y="575" font-size="13" font-weight="bold" fill="#1a2a44">Last status</text>
<text x="678" y="575" font-size="13" font-weight="bold" fill="#1a2a44">New status</text>
<text x="848" y="575" font-size="13" font-weight="bold" fill="#1a2a44">Result</text>
<rect x="520" y="585" width="505" height="30" fill="#fff" stroke="#9db3d6"/>
<text x="528" y="605" font-size="13" fill="#1a2a44">HEALTHY</text>
<text x="678" y="605" font-size="13" fill="#1a2a44">HEALTHY</text>
<text x="848" y="605" font-size="13" fill="#1a2a44">Nothing</text>
<rect x="520" y="615" width="505" height="30" fill="#fff" stroke="#9db3d6"/>
<text x="528" y="635" font-size="13" fill="#1a2a44">HEALTHY</text>
<text x="678" y="635" font-size="13" fill="#1a2a44">WARNING / CRITICAL</text>
<text x="848" y="635" font-size="13" fill="#1a2a44">Alert</text>
<rect x="520" y="645" width="505" height="30" fill="#fff" stroke="#9db3d6"/>
<text x="528" y="665" font-size="13" fill="#1a2a44">WARNING</text>
<text x="678" y="665" font-size="13" fill="#1a2a44">CRITICAL (or reverse)</text>
<text x="848" y="665" font-size="13" fill="#1a2a44">Alert</text>
<rect x="520" y="675" width="505" height="30" fill="#fff" stroke="#9db3d6"/>
<text x="528" y="695" font-size="13" fill="#1a2a44">CRITICAL</text>
<text x="678" y="695" font-size="13" fill="#1a2a44">CRITICAL</text>
<text x="848" y="695" font-size="13" fill="#1a2a44">Nothing (already reported)</text>
<rect x="520" y="705" width="505" height="30" fill="#fff" stroke="#9db3d6"/>
<text x="528" y="725" font-size="13" fill="#1a2a44">WARNING / CRITICAL</text>
<text x="678" y="725" font-size="13" fill="#1a2a44">HEALTHY</text>
<text x="848" y="725" font-size="13" fill="#1a2a44">RECOVERED message</text>
<text x="520" y="765" font-size="13" fill="#33415c">If sending to Telegram fails, the status is not saved, so the alert is retried on the next run.</text>
<text x="1060" y="560" font-size="16" font-weight="bold" fill="#12305c">Server-only files (not in Git)</text>
<text x="1060" y="588" font-size="13.5" fill="#33415c">- telegram.conf  (bot token and chat ID)</text>
<text x="1060" y="610" font-size="13.5" fill="#33415c">- logs/health.log</text>
<text x="1060" y="632" font-size="13.5" fill="#33415c">- logs/last_status</text>
<text x="1060" y="654" font-size="13.5" fill="#33415c">- /var/www/health/index.html</text>
<text x="1060" y="690" font-size="13" fill="#33415c">Both timers: Persistent=true, start at boot.</text>
</svg>